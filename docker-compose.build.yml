# ============================================================================
# Jarvis 007 - BUILD FROM SOURCE (instead of pulling the GHCR image).
#   docker compose -f docker-compose.build.yml up -d --build
# Use when: self-hosting your own registry, forking and editing code, or testing an image before pushing it.
# ============================================================================
services:
  javis:
    build:
      context: .
      args:
        CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-latest}
    image: ghcr.io/blogminhquy/javis-os:latest
    container_name: ${JAVIS_NAME:-javis}          # change in .env when running several copies on one machine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${JAVIS_HOST_PORT:-7777}:7777"
    volumes:
      - javis-data:/data
      - javis-brains:/brains      # switch to  ./brains:/brains  if you want git backup (chown -R 10001 ./brains)
      - claude-auth:/home/javis/.claude
      - codex-auth:/home/javis/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('JAVIS_PORT','7777')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  javis-data:
  javis-brains:
  claude-auth:
  codex-auth:
