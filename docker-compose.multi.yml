# ============================================================================
# Jarvis 007 - override to run MULTIPLE COPIES on the same VPS, each with its own domain.
#
# Use TOGETHER WITH docker-compose.yml, and it needs the shared proxy to be running first
# (docker-compose.proxy.yml - do it once for the whole machine).
#
# HOW TO USE - each copy in its OWN FOLDER:
#
#   mkdir -p ~/javis-shop && cd ~/javis-shop
#   curl -fsSLO https://raw.githubusercontent.com/blogminhquy/javis-os/main/docker-compose.yml
#   curl -fsSLO https://raw.githubusercontent.com/blogminhquy/javis-os/main/docker-compose.multi.yml
#   cat > .env <<'EOF'
#   JAVIS_NAME=javis-shop
#   JAVIS_HOST_PORT=7777
#   JAVIS_BIND=127.0.0.1
#   DOMAIN_NAME=shop.tencuaban.com
#   JAVIS_ADMIN_USER=admin
#   JAVIS_ADMIN_PASSWORD=mat-khau-manh-rieng-cho-ban-nay
#   EOF
#   chmod 600 .env
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml run --rm javis claude auth login --claudeai
#   docker compose -f docker-compose.yml -f docker-compose.multi.yml up -d
#
# For the second copy, do exactly the same in another folder, changing ALL THREE values in .env:
#   JAVIS_NAME=javis-ca-nhan   JAVIS_HOST_PORT=7778   DOMAIN_NAME=canhan.tencuaban.com
#
# THOSE THREE VALUES MUST DIFFER BETWEEN COPIES. Same JAVIS_NAME and Docker reports the container name already in
# use; same JAVIS_HOST_PORT and it reports the port already taken; same DOMAIN_NAME and two copies fight over
# one domain and the proxy can only route to one copy.
#
# EACH COPY IS A COMPLETELY INDEPENDENT JARVIS 007: different folders -> different project names -> different
# volumes, so state, brain, admin account, and Claude/ChatGPT login tokens are all separate. If you want
# two copies to SHARE one Claude login, point them at the same claude-auth volume (advanced, you are on your own).
#
# DIFFERENT from docker-compose.https.yml: that file builds Caddy INSIDE Jarvis 007's project, right for a machine
# running only ONE copy (domain entered in the app, on-demand TLS). With several copies Caddy has to sit outside,
# so the domain moves to being declared in .env - exactly how the Hostinger version does it.
# ============================================================================
services:
  javis:
    # DELIBERATELY NOT declaring `ports` here: compose CONCATENATES the ports lists across -f files instead of
    # replacing them, so redeclaring gives two bindings on the same port and Docker reports "port is already
    # allocated". Pulling the port back to loopback is done with JAVIS_BIND=127.0.0.1 in .env (see the top of the file).
    networks:
      - default        # must be listed again: declaring networks on a service REPLACES the list, it does not add to it
      - javis-web
    labels:
      # The shared proxy reads exactly these two labels and then builds the site + requests a certificate by itself.
      caddy: ${DOMAIN_NAME:?DOMAIN_NAME is not set - add DOMAIN_NAME=your-domain to .env}
      caddy.reverse_proxy: "{{upstreams 7777}}"

networks:
  javis-web:
    external: true
    name: javis-web
