<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis 007 · Brain preview</title><link rel="stylesheet" href="/dashboard/brain-spatial.css"><style>
*{box-sizing:border-box}body{margin:0;background:#070e18;color:#d9e5ef;font:14px system-ui}header{padding:20px 28px;border-bottom:1px solid #d3ae6133;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:17px;font-weight:500;letter-spacing:1px;margin:0}header small{color:#91a8b7}#brain{height:calc(100dvh - 140px);min-height:330px;max-width:1300px;margin:auto;background:radial-gradient(ellipse at 50% 50%,#0b203233,transparent 70%)}footer{padding:14px 22px;color:#8ca2b2;text-align:center;font-size:12px}dialog{max-width:450px;background:#102333;color:#e8eff4;border:1px solid #b99858;border-radius:14px;padding:24px}button{cursor:pointer}@media(max-width:600px){header{padding:14px;display:block}header small{display:block;margin-top:8px}#brain{height:calc(100dvh - 170px)}}
</style></head><body><header><h1>JARVIS 007 / MEMORY ATLAS</h1><small>Interactive design preview · fictional sample memories</small></header><main id="brain"></main><footer>Drag to turn · Scroll or pinch to zoom · Shift-drag to pan · Select a dot to inspect a memory</footer><dialog id="note"><h2></h2><p>Preview memory only. The installed dashboard opens the corresponding real vault note.</p><button onclick="document.querySelector('dialog').close()">Close</button></dialog><script src="/dashboard/graph.js"></script><script src="/dashboard/brain-spatial.js"></script><script>
/* Jarvis 007: offline preview fixture, never reads the user's brain or account. */
const categories=['Research','Projects','Content','Photography','Operations','Design'];
const topics=['Brand voice','Wedding storytelling','Content pillars','Evidence checklist','Editing approach','Project review','Audience questions','Creative direction'];
const nodes=Array.from({length:240},(_,i)=>({id:'preview-memory-'+i,label:topics[i%topics.length]+' '+(1+Math.floor(i/topics.length)),path:'wiki/'+categories[i%6].toLowerCase()+'/memory-'+i+'.md',category:categories[i%6].toLowerCase(),links:i%7,t:i}));
const edges=nodes.slice(1).filter((_,i)=>i%3===0).map((n,i)=>({source:n.id,target:nodes[i%nodes.length].id}));
window.onGraphNodeClick=n=>{document.querySelector('#note h2').textContent=n.label;document.querySelector('#note').showModal()};
const brain=new JavisGraph(document.querySelector('#brain'));brain._prep(nodes);brain.graph.graphData({nodes,links:edges});window.previewBrain=brain;
</script></body></html>
