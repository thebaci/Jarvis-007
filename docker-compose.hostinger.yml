# ============================================================================
# Jarvis 007 - HOSTINGER VPS (Docker Manager). Domain + HTTPS via Hostinger's built-in Traefik.
#
# This file ALWAYS deploys:
#   - DOMAIN_NAME not set  -> runs temporarily, reach it with the Open button / http://<ip>:7777 (no HTTPS yet).
#   - DOMAIN_NAME set      -> Hostinger's Traefik issues HTTPS for that domain automatically.
#
# HOW TO USE:
#   1) Docker Manager > Compose > URL > paste:
#      https://raw.githubusercontent.com/blogminhquy/javis-os/main/docker-compose.hostinger.yml
#   2) The Environment box only needs 4 useful fields:
#        DOMAIN_NAME, JAVIS_ADMIN_USER, JAVIS_ADMIN_PASSWORD, JAVIS_AUTO_UPDATE.
#      (With JAVIS_AUTO_UPDATE=true, Jarvis 007 updates ITSELF every day, no button needed. Leave it empty and
#       you update with the "Update now" button in the app - see the watchtower service below.)
#      (2 more fields are needed ONLY when you install a SECOND Jarvis 007 or later on the same VPS - see the end of the file:
#        JAVIS_NAME, JAVIS_HOST_PORT. For the first install, leave both empty.)
#      Set DOMAIN_NAME to get HTTPS:
#        - Free link (NO need to buy a domain):  DOMAIN_NAME=javis.<vps-hostname>.hstgr.cloud
#          (find the hostname in hPanel > VPS, e.g. DOMAIN_NAME=javis.srv1782015.hstgr.cloud)
#        - Or your own domain:  DOMAIN_NAME=yourdomain.com  (point a DNS A record at the VPS IP first).
#   3) Deploy > wait 1-3 minutes for Traefik to issue SSL > open  https://<DOMAIN_NAME>.
#
# Can't find the Environment box? Click Manage > edit the .yaml, and change the Host(...) line directly to the domain:
#      Host(`javis.srv1782015.hstgr.cloud`)   (replace with your VPS hostname).
#
# NOTES:
#   - The key point: do NOT declare networks - Hostinger's Traefik finds the container through its labels.
#   - Updating to a new version: click "Update now" right in the app (Update page). That button needs
#     the watchtower container below; if it can't start, you can still Redeploy as before.
#   - VPS that is NOT Hostinger: skip this file, use docker-compose.yml + docker-compose.https.yml (Caddy).
#   - The GHCR image must be PUBLIC (GitHub > Packages > javis-os > Package settings > Public).
# ============================================================================
services:
  javis:
    image: ghcr.io/blogminhquy/javis-os:latest
    # The container name + Traefik router/service names all come from JAVIS_NAME. Empty = "javis" as before.
    # When installing a SECOND copy on the same VPS, use a different name (e.g. javis-shop), otherwise Docker
    # reports the name as already in use and Traefik gets two routers with the same name so it can only route to one copy.
    container_name: ${JAVIS_NAME:-javis}
    restart: unless-stopped
    pull_policy: always
    # Put the Hostinger target inside the run command so it does NOT turn into a junk field
    # in Docker Manager's Environment box.
    command: ["sh", "-c", "JAVIS_DEPLOY_TARGET=hostinger exec python -m uvicorn main:app --app-dir server --host 0.0.0.0 --port 7777"]
    environment:
      # Keep only the fields the installer really needs. Port/path/state/brain already have
      # correct defaults in the Docker image, so they don't need to show up as a pile of technical boxes.
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      JAVIS_ADMIN_USER: ${JAVIS_ADMIN_USER:-admin}
      JAVIS_ADMIN_PASSWORD: ${JAVIS_ADMIN_PASSWORD:-}
      # Same token as the watchtower service below -> the "Update now" button can call it.
      # HARDCODED rather than taken from a variable, for a reason: every `${...}` in this file adds another box
      # to Docker Manager's Environment form, and nobody needs to change this token - Watchtower's port 8080
      # is not published outside, only containers in the same stack can reach it.
      # If you want your own token, use docker-compose.yml (the VPS version), which accepts the WATCHTOWER_TOKEN variable.
      WATCHTOWER_TOKEN: javis-update
    ports:
      # Fallback way in (Open button / http://<ip>:7777). A second copy MUST change this port
      # (JAVIS_HOST_PORT=7778) because a host port can only be held by one container.
      - "${JAVIS_HOST_PORT:-7777}:7777"
    labels:
      # Guide (Documentation / Quick start) in Docker Manager - points to the GitHub docs.
      - org.opencontainers.image.documentation=https://github.com/blogminhquy/javis-os/blob/main/docs/README.md
      - org.opencontainers.image.source=https://github.com/blogminhquy/javis-os
      - com.hostinger.documentation=https://github.com/blogminhquy/javis-os/blob/main/docs/README.md
      - com.hostinger.quickstart=https://github.com/blogminhquy/javis-os/blob/main/QUICKSTART.md
      # The router/service carries the COPY'S NAME (JAVIS_NAME) rather than hardcoding "javis": Traefik names
      # routers machine-wide, so two copies with the same router name means the later one overwrites the earlier one and one
      # of the two domains dies. With JAVIS_NAME empty it still comes out as "javis" exactly as before.
      # Host = ${DOMAIN_NAME}; if not set it defaults to "localhost" (the deploy still runs, just without a domain/HTTPS).
      - traefik.enable=true
      - traefik.http.routers.${JAVIS_NAME:-javis}.rule=Host(`${DOMAIN_NAME:-localhost}`)
      - traefik.http.routers.${JAVIS_NAME:-javis}.entrypoints=websecure
      - traefik.http.routers.${JAVIS_NAME:-javis}.tls.certresolver=letsencrypt
      - traefik.http.routers.${JAVIS_NAME:-javis}.service=${JAVIS_NAME:-javis}
      - traefik.http.services.${JAVIS_NAME:-javis}.loadbalancer.server.port=7777
    volumes:
      - javis-data:/data
      - javis-brains:/brains
      - claude-auth:/home/javis/.claude
      - codex-auth:/home/javis/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('JAVIS_PORT','7777')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ------------------------------------------------------------------------
  # 1-CLICK update from inside the app (the "Update now" button on the Update page). AVAILABLE since 0.55.56.
  #
  # The history has to be told honestly, because it is the reason this block was once ABSENT: the 2026-07-18 version tried it and then removed
  # it, because on Docker Manager the Watchtower container kept Restarting and the stack showed
  # "Partially running". Back then the guess was "cannot reach the Docker socket" - WRONG. The real log (re-measured
  # 2026-10-01 on a Hostinger VPS) was:
  #   client version 1.25 is too old. Minimum supported API version is 1.40
  # The old image `containrrr/watchtower` defaults to Docker API 1.25, and newer Docker Engines refuse it.
  # That repo has been archived (read-only since 12/2025) so the bug will never be fixed there.
  #
  # We now use the maintained fork `nicholas-fedor/watchtower`: it negotiates the API version with
  # Docker by itself, same port 8080, same `POST /v1/update` + Bearer token that the app already calls. Pin major `:1`
  # so v2 (which will drop the old-style HTTP API variables) does not slip in on its own and kill the button again.
  # Do NOT patch with DOCKER_API_VERSION=1.40 on the old image: Docker keeps raising the minimum.
  #
  # What does NOT change: the javis container above RUNS NORMALLY even when Watchtower is broken. It is a
  # SEPARATE container, so if it breaks you only lose the button, the app is not dragged down. On "Partially running",
  # open the log of container `javis-watchtower`; if it can't be fixed, update by REDEPLOY as before,
  # and the Update page in the app says exactly that too.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1
    container_name: ${JAVIS_NAME:-javis}-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update                 # accepts the update command from the button
      WATCHTOWER_HTTP_API_TOKEN: javis-update               # matches the app's WATCHTOWER_TOKEN above
      # AUTOMATICALLY finds a new version and rebuilds, WITHOUT waiting for anyone to click. This is the FOURTH Environment box, and the
      # only `${...}` added to this file - because it is a CHOICE for the installer, not
      # a technical default: turning it on means Jarvis 007 restarts itself any time a new version appears,
      # interrupting background work and running chat sessions. Empty = off, update with the button.
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${JAVIS_AUTO_UPDATE:-false}
      WATCHTOWER_POLL_INTERVAL: 86400                       # 24h, only takes effect when enabled above
      WATCHTOWER_CLEANUP: "true"                            # clean up old images after updating
    # Do NOT attach traefik.* labels: this is an internal container, there is nothing to expose to the Internet.
    labels:
      - traefik.enable=false
    # Watch EXACTLY this copy's container. If "javis" is hardcoded then on a VPS with two copies, this copy's Watchtower
    # would go update and restart the other copy's container.
    command: ${JAVIS_NAME:-javis}

# ============================================================================
# MULTIPLE JARVIS 007 COPIES ON THE SAME HOSTINGER VPS
#
# Deploy this compose ONE MORE TIME (a new stack in Docker Manager), changing ALL THREE:
#   Stack 1:  DOMAIN_NAME=shop.srv1782015.hstgr.cloud    JAVIS_NAME=(empty)     JAVIS_HOST_PORT=(empty)
#   Stack 2:  DOMAIN_NAME=canhan.srv1782015.hstgr.cloud  JAVIS_NAME=javis-canhan  JAVIS_HOST_PORT=7778
#
# All three values must differ between stacks. Same JAVIS_NAME -> Docker reports the container name already in
# use; same JAVIS_HOST_PORT -> reports the port already taken; same DOMAIN_NAME -> two copies fight over
# one link. Hostinger's wildcard DNS *.hstgr.cloud is built in, so any subdomain resolves right away.
#
# Each stack has its own volumes, so state / brain / admin account / Claude login token are all
# SEPARATE. You have to log in to Claude once for each copy (the App terminal of that stack).
# ============================================================================

volumes:
  javis-data:
  javis-brains:
  claude-auth:
  codex-auth:
