# ============================================================================
# Jarvis 007 - SHARED PROXY for MULTIPLE Jarvis 007 copies on the same VPS.
#
# Run ONCE for the whole machine (not one per copy). It holds ports 80/443, requests
# and renews Let's Encrypt certificates by itself, and routes each domain to its own Jarvis 007 copy.
#
# WHY IT HAS TO BE A SEPARATE FILE: a machine has only ONE port 443. The Caddy in
# docker-compose.https.yml lives in the same project as Jarvis 007, so bringing up a second Jarvis 007 means
# two Caddys fighting over port 443 and the second one dies. The proxy has to live outside every copy.
#
# INSTALL (once for the whole VPS):
#   docker network create javis-web
#   curl -fsSLO https://raw.githubusercontent.com/blogminhquy/javis-os/main/docker-compose.proxy.yml
#   docker compose -f docker-compose.proxy.yml -p javis-proxy up -d
#
# AFTER THAT each Jarvis 007 copy runs in its OWN FOLDER with its own .env (see docker-compose.multi.yml):
#   JAVIS_NAME=javis-shop     JAVIS_HOST_PORT=7777   DOMAIN_NAME=shop.tencuaban.com
#   JAVIS_NAME=javis-ca-nhan  JAVIS_HOST_PORT=7778   DOMAIN_NAME=canhan.tencuaban.com
#
# The proxy DISCOVERS new copies through Docker labels - adding or removing a copy needs NO change here,
# and no proxy restart either. Exactly how Hostinger's Traefik does it.
#
# POINT DNS: one A record per subdomain to the VPS IP. The certificate is issued on the first open.
#
# ⚠️ The proxy reads the Docker socket (READ only) to see the containers' labels. This is a powerful permission -
#    the same kind Watchtower needs. Only run this file on your own VPS.
# ============================================================================
services:
  proxy:
    image: lucaslorentz/caddy-docker-proxy:2.13-alpine
    container_name: javis-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      # Only look at containers on this network -> does not accidentally expose the VPS's other containers to the Internet.
      CADDY_INGRESS_NETWORKS: javis-web
      # To have Let's Encrypt send expiry warnings to an email: bind-mount a Caddyfile containing only
      #   { email you@yourdomain.com }
      # and point CADDY_DOCKER_CADDYFILE_PATH at it. Leaving it unset still works and certificates still renew automatically.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-data:/data       # issued certificates - kept across restarts, not requested again (avoids exhausting the rate limit)
      - proxy-config:/config
    networks:
      - javis-web

networks:
  javis-web:
    external: true
    name: javis-web

volumes:
  proxy-data:
  proxy-config:
