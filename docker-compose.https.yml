# ============================================================================
# Auto-HTTPS with Caddy + Let's Encrypt (ON-DEMAND TLS) - for a Docker VPS with ports 80/443 open.
#
# DIFFERENT from the old version: you do NOT need to set DOMAIN at run time. You enter the domain RIGHT IN THE APP
#   (⚙ Settings → Custom domain). Caddy asks the backend /tls-check and then requests a certificate for
#   EXACTLY that domain on the first request → nobody can point DNS at the IP at random to force us to request a cert.
#
#   1) Run:  docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#   2) Open http://<vps-ip>:7777 → ⚙ Settings → Custom domain → enter the domain → Save.
#   3) Point DNS (A record: your-domain → <vps-ip>) following the instructions shown in the app.
#   4) Open https://your-domain → the certificate is issued and renewed automatically. Done.
#
# ONLY FOR A MACHINE RUNNING A SINGLE JARVIS 007. The Caddy here lives in the SAME project as Jarvis 007, and a machine has only
# one port 443 - bringing up a second Jarvis 007 with this file means two Caddys fight over the port and the later one dies.
# For several copies, each with its own domain → use docker-compose.proxy.yml + docker-compose.multi.yml
# (the proxy sits outside, runs once for the whole VPS, and discovers new copies through Docker labels).
#
# (Do NOT use on Hostinger Docker Manager: ports 80/443 are already taken by Hostinger's proxy →
#  use Hostinger's built-in SSL, see DEPLOY.md.)
# Requires Docker Compose v2.23.1+ (supports configs.content). Check with: docker compose version
# ============================================================================
configs:
  javis_caddyfile:
    content: |
      {
        on_demand_tls {
          ask http://javis:7777/tls-check
        }
      }
      https:// {
        tls {
          on_demand
        }
        reverse_proxy javis:7777
      }
      http:// {
        redir https://{host}{uri}
      }

services:
  # The backend stays the same; the Secure cookie turns on automatically when Host matches the domain (the server handles it, no env needed).
  caddy:
    image: caddy:2-alpine
    container_name: javis-caddy
    restart: unless-stopped
    depends_on:
      - javis
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: javis_caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data       # issued certificates - kept across restarts, not requested again
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
