name: Kanban tasks
name_en: "Kanban tasks"
slug: javis-task
version: 1.0.0
description: "Queues a background task on the Kanban board and shows how far running tasks have got, right from chat. Before this tool only engines that run shell commands (Claude Code, Codex) could queue work, because the only route was curl POST /kanban/task; the five API engines were left out."
