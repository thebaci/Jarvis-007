name: Tool usage log
name_en: "Tool usage log"
slug: tool-audit
version: 1.0.0
description: "Counts how many times EACH tool is called by an engine (through the post_tool_call hook) and shows the most used tools. It is a demo of the plugin HOOK mechanism. OFF by default: turn it on with POST /plugins/toggle (slug=tool-audit) to try it."
description_en: "Counts how many times EACH tool is called by an engine (through the post_tool_call hook) and shows the most used tools. It is a demo of the plugin HOOK mechanism. OFF by default: turn it on with POST /plugins/toggle (slug=tool-audit) to try it."
author: Jarvis 007 (bundled)
enabled: false
min_mode: readonly
tools:
  - javis_tool_stats
hooks:
  - post_tool_call
