name: "Control apps on this computer"
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: "Opens, closes and lists apps on THE MACHINE running Jarvis 007 (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when Jarvis 007 runs in Docker on a server, because then the machine running Jarvis 007 is not yours."
description_en: "Opens, closes and lists apps on THE MACHINE running Jarvis 007 (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when Jarvis 007 runs in Docker on a server, because then the machine running Jarvis 007 is not yours."
author: Jarvis 007 (bundled)
enabled: true
min_mode: safe
tools:
  - javis_app_list
  - javis_app_open
  - javis_app_close
hooks: []
