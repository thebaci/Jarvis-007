name: Build & Publish Docker image (GHCR)

# Every push to main → build the Docker image and push it to GitHub Container Registry
# (ghcr.io/blogminhquy/javis-os). Hostinger Docker Manager / a VPS only needs to PULL this image.
on:
  push:
    branches: [main]
    # Skip the build only for a push that is PURELY documentation (does not affect the image).
    # CLAUDE.md is the system prompt loaded into the image → do NOT ignore it, so editing it triggers a rebuild.
    paths-ignore:
      - "README.md"
      - "DEPLOY.md"
      - ".learn/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Read app version
        run: echo "APP_VERSION=$(cat VERSION | tr -d ' \n\r')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve current Codex CLI version
        shell: bash
        run: |
          version="$(npm view @openai/codex@latest version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Codex version: $version"; exit 1; }
          echo "CODEX_CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Codex CLI: $version" >> "$GITHUB_STEP_SUMMARY"

      # Same reason as Codex above: `@latest` in the Dockerfile is a string that NEVER changes, so the gha
      # cache keeps the old npm layer forever and new images still carry the old Claude Code. A new model (Sonnet 5.5)
      # therefore never reaches the VPS. Passing the real version number makes the layer change when a new release ships.
      - name: Resolve current Claude Code version
        shell: bash
        run: |
          version="$(npm view @anthropic-ai/claude-code@latest version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Claude Code version: $version"; exit 1; }
          echo "CLAUDE_CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Claude Code: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CODEX_CLI_VERSION=${{ env.CODEX_CLI_VERSION }}
            CLAUDE_CLI_VERSION=${{ env.CLAUDE_CLI_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
